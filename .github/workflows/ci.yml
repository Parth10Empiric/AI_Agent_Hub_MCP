name: CI

# Phase 5.9.
#
# There was no CI at all before this. The point is not coverage
# theatre - it is that the five checks below are things somebody
# already runs by hand and will eventually forget to.

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Several test files talk to a real PostgreSQL - the isolation
        # tests, the rotation tests, the audit tests. They SKIP when it
        # is unreachable, which means without this service they would
        # pass by not running. That is worse than failing.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agenthub_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agenthub_ci
      JWT_SECRET_KEY: ci-only-not-a-real-secret
      # A throwaway Fernet key. Generated here rather than stored,
      # because a valid key in a repository is a valid key.
      CREDENTIAL_ENCRYPTION_KEY: dGVzdC1rZXktZm9yLWNpLW9ubHktMzItYnl0ZXM9

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.10 to match the deployment. The requirements file carries
          # environment markers for exactly this reason - see
          # rpds-py, which is pinned differently below 3.11.
          python-version: "3.10"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate
        run: alembic upgrade head

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Secrets have not leaked
        run: python scripts/check_secrets.py

      - name: Nothing dangerous is tracked
        # A grep that fails the build is worth more than a rule in a
        # README. Playwright traces record every form fill, including
        # the access-token field.
        run: |
          if git ls-files | grep -E '(test-results/|\.env$|token\.json|credentials\.json)'; then
            echo "::error::files that must never be committed are tracked"
            exit 1
          fi

      - name: Dependency audit
        # NON-BLOCKING to start with. pip-audit will flag transitive
        # things you cannot fix today, and a gate that is red on day
        # one gets disabled on day two. Read it for a few weeks, then
        # remove `continue-on-error`.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --strict

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - name: Build
        env:
          NEXT_DIST_DIR: .next-ci
        run: npm run build
